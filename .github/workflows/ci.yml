name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CORE_PACKAGES: ./internal/statemachine,./internal/queue,./worker,./internal/maintenance,./internal/api,./client,./internal/checker,./internal/telemetry,./internal/demo,./internal/bench

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: unit, integration, property and fault-injection tests (race detector)
        run: go test -race -timeout 25m -coverpkg="$CORE_PACKAGES" -coverprofile=coverage.out ./...
      - name: core coverage at least 85%
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%", "", $3); print $3}')
          echo "core statement coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t >= 85) ? 0 : 1 }'

  tlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: TLC model check and mutation check
        run: scripts/tlc.sh

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t conveyor:ci .
      - name: scan image and dependencies (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.2 \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed conveyor:ci
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.67.2 \
            fs --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln,secret,misconfig /src
      - name: end-to-end smoke test of the demo stack
        run: |
          cp .env.example .env
          docker compose -f compose-demo.yml up -d --build
          for i in $(seq 1 60); do curl -skf https://localhost/readyz && break; sleep 2; done
          code=$(curl -s -o /dev/null -w '%{http_code}' -XPOST localhost:8080/v1/jobs -d '{"queue":"default","kind":"work"}')
          [ "$code" = 401 ] || { echo "unauthenticated write returned $code"; exit 1; }
          id=$(curl -sf -XPOST localhost:8080/v1/jobs -H 'Authorization: Bearer change-me-token' \
            -d '{"queue":"default","kind":"work","args":"{\"ms\":50}"}' | jq -r .id)
          curl -sf -XPOST localhost:8080/demo/chaos
          for i in $(seq 1 60); do
            state=$(curl -sf "localhost:8080/v1/jobs/$id" | jq -r .state)
            [ "$state" = completed ] && break
            sleep 1
          done
          [ "$state" = completed ] || { echo "job $id ended $state"; exit 1; }
          curl -sf localhost:8080/demo/check | jq -e '.violations == null'
          curl -sf localhost:8080/metrics | grep -q conveyor_queue_depth
      - name: logs on failure
        if: failure()
        run: docker compose -f compose-demo.yml logs --tail 200
