name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
      - name: test with race detector
        run: go test -race -coverprofile=coverage.out ./...
      - name: govulncheck
        uses: golang/govulncheck-action@v1

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate compose files
        run: |
          docker compose -f docker-compose.yml config
          docker compose -f compose-demo.yml config
      - name: start postgres
        run: docker compose -f docker-compose.yml up --wait -d
      - name: smoke test postgres
        run: |
          docker compose -f docker-compose.yml exec -T postgres \
            psql -U conveyor -d conveyor -c "SELECT 1"

  tlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: download tla2tools (pinned v1.8.0)
        run: curl -sSfL -o tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
      - name: TLC model check
        working-directory: spec/tla
        run: java -cp ../../tla2tools.jar tlc2.TLC Conveyor.tla -config Conveyor.cfg -deadlock
