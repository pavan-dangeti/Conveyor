syntax = "proto3";

package conveyor.v1;

option go_package = "github.com/pavan-dangeti/Conveyor/api/conveyor/v1;conveyorv1";

import "google/api/annotations.proto";

service Conveyor {
  rpc Enqueue(EnqueueRequest) returns (EnqueueResponse) {
    option (google.api.http) = { post: "/v1/jobs" body: "*" };
  }
  rpc GetJob(GetJobRequest) returns (Job) {
    option (google.api.http) = { get: "/v1/jobs/{id}" };
  }
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse) {
    option (google.api.http) = { get: "/v1/jobs" };
  }
  rpc CancelJob(CancelJobRequest) returns (StatusResponse) {
    option (google.api.http) = { post: "/v1/jobs/{id}:cancel" body: "*" };
  }
  rpc RetryJob(RetryJobRequest) returns (StatusResponse) {
    option (google.api.http) = { post: "/v1/jobs/{id}:retry" body: "*" };
  }
  rpc DiscardJob(DiscardJobRequest) returns (StatusResponse) {
    option (google.api.http) = { post: "/v1/jobs/{id}:discard" body: "*" };
  }
  rpc ListQueues(ListQueuesRequest) returns (ListQueuesResponse) {
    option (google.api.http) = { get: "/v1/queues" };
  }
  rpc CreateCron(CreateCronRequest) returns (CronSchedule) {
    option (google.api.http) = { post: "/v1/cron" body: "*" };
  }
  rpc GetStats(GetStatsRequest) returns (Stats) {
    option (google.api.http) = { get: "/v1/stats" };
  }
}

message Job {
  int64 id = 1;
  string queue = 2;
  string kind = 3;
  string args = 4;
  string state = 5;
  int32 priority = 6;
  int32 attempt = 7;
  int32 max_attempts = 8;
  string run_at = 9;
  int64 lease_version = 10;
  string created_at = 11;
  string error = 12;
  string lease_owner = 13;
  repeated int64 depends_on = 14;
}

message EnqueueRequest {
  string queue = 1;
  string kind = 2;
  string args = 3;
  int32 priority = 4;
  int32 max_attempts = 5;
  string idempotency_key = 6;
  int32 delay_seconds = 7;
  // RFC 3339; overrides delay_seconds when set.
  string run_at = 8;
  // Workflow edges: this job runs only after every listed job completes.
  repeated int64 depends_on = 9;
}
message EnqueueResponse { int64 id = 1; bool deduped = 2; }

message GetJobRequest { int64 id = 1; }
message ListJobsRequest {
  string queue = 1;
  string state = 2;
  int32 limit = 3;
}
message ListJobsResponse { repeated Job jobs = 1; }
message CancelJobRequest { int64 id = 1; }
message RetryJobRequest { int64 id = 1; }
message DiscardJobRequest { int64 id = 1; }
message StatusResponse { bool ok = 1; }
message ListQueuesRequest {}
message QueueInfo {
  string name = 1;
  int32 concurrency = 2;
  double rate_limit_per_sec = 3;
  map<string, int64> depth_by_state = 4;
}
message ListQueuesResponse { repeated QueueInfo queues = 1; }
message CronSchedule {
  int64 id = 1;
  string queue = 2;
  string kind = 3;
  string args = 4;
  string spec = 5;
  string next_run_at = 6;
  bool enabled = 7;
}
message CreateCronRequest {
  string queue = 1;
  string kind = 2;
  string args = 3;
  string spec = 4;
}

message GetStatsRequest {
  // Window for throughput and latency, default 60.
  int32 window_seconds = 1;
}
message Stats {
  int32 window_seconds = 1;
  double completed_per_sec = 2;
  double start_latency_p50_ms = 3;
  double start_latency_p95_ms = 4;
  double start_latency_p99_ms = 5;
  int64 retries = 6;
  int64 dead_letter = 7;
  int64 lease_expirations = 8;
}
