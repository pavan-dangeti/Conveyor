# Public demo: Postgres, the API in demo mode (synthetic load, three
# supervised worker processes, chaos endpoint) and Caddy for TLS.
#   cp .env.example .env    # then set the secrets
#   docker compose -f compose-demo.yml up -d --build
#   docker compose -f compose-demo.yml --profile observability up -d   # + Prometheus, Grafana, Jaeger
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: conveyor
      POSTGRES_USER: conveyor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conveyor -d conveyor"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    environment:
      MIGRATIONS_DATABASE_URL: postgres://conveyor:${POSTGRES_PASSWORD}@postgres:5432/conveyor?sslmode=disable
      DATABASE_URL: postgres://conveyor_app:${APP_DB_PASSWORD}@postgres:5432/conveyor?sslmode=disable
      CONVEYOR_API_TOKEN: ${CONVEYOR_API_TOKEN:?set CONVEYOR_API_TOKEN in .env}
      CONVEYOR_PUBLIC_READ: "1"
      DOMAIN: ${DOMAIN:-localhost}
      CONVEYOR_DEMO: "1"
      DEMO_WORKERS: "3"
      DEMO_RATE: ${DEMO_RATE:-4}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9091:9090"

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"

  jaeger:
    image: jaegertracing/jaeger:2.9.0
    profiles: [observability]
    ports:
      - "127.0.0.1:16686:16686"

volumes:
  pgdata:
  caddy_data:
