# Demo stack: Postgres + API/dashboard + 3 workers + synthetic workload.
# Chaos: docker compose -f compose-demo.yml stop worker-1  (jobs recover within a few seconds)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: conveyor
      POSTGRES_USER: conveyor
      POSTGRES_PASSWORD: conveyor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conveyor -d conveyor"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgres://conveyor:conveyor@postgres:5432/conveyor?sslmode=disable
      HTTP_ADDR: :8080
      GRPC_ADDR: :9090
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
  worker-1:
    build: .
    entrypoint: ["/usr/local/bin/harness-worker"]
    environment:
      DATABASE_URL: postgres://conveyor:conveyor@postgres:5432/conveyor?sslmode=disable
      QUEUE: default
      OWNER: worker-1
    depends_on:
      - api
  worker-2:
    build: .
    entrypoint: ["/usr/local/bin/harness-worker"]
    environment:
      DATABASE_URL: postgres://conveyor:conveyor@postgres:5432/conveyor?sslmode=disable
      QUEUE: default
      OWNER: worker-2
    depends_on:
      - api
  worker-3:
    build: .
    entrypoint: ["/usr/local/bin/harness-worker"]
    environment:
      DATABASE_URL: postgres://conveyor:conveyor@postgres:5432/conveyor?sslmode=disable
      QUEUE: default
      OWNER: worker-3
    depends_on:
      - api
  demoload:
    build: .
    entrypoint: ["/usr/local/bin/demoload"]
    environment:
      DATABASE_URL: postgres://conveyor:conveyor@postgres:5432/conveyor?sslmode=disable
    depends_on:
      - api
